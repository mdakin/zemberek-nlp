<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Zemberek Ayarları</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-light: #ffffff;
        --bg-dark: #18181b;
        --surface-light: #f4f4f5;
        --surface-dark: #27272a;
        --fg-light: #18181b;
        --fg-dark: #f4f4f5;
        --muted-light: #52525b;
        --muted-dark: #a1a1aa;
        --border-light: #e4e4e7;
        --border-dark: #3f3f46;
        --accent-light: #0d9488;
        --accent-dark: #2dd4bf;
        --bg: var(--bg-light);
        --surface: var(--surface-light);
        --fg: var(--fg-light);
        --muted: var(--muted-light);
        --border: var(--border-light);
        --accent: var(--accent-light);
        accent-color: var(--accent);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--bg-dark);
          --surface: var(--surface-dark);
          --fg: var(--fg-dark);
          --muted: var(--muted-dark);
          --border: var(--border-dark);
          --accent: var(--accent-dark);
        }
      }

      @supports (color: light-dark(white, black)) {
        :root {
          --bg: light-dark(var(--bg-light), var(--bg-dark));
          --surface: light-dark(var(--surface-light), var(--surface-dark));
          --fg: light-dark(var(--fg-light), var(--fg-dark));
          --muted: light-dark(var(--muted-light), var(--muted-dark));
          --border: light-dark(var(--border-light), var(--border-dark));
          --accent: light-dark(var(--accent-light), var(--accent-dark));
        }
      }

      body {
        margin: 0;
        padding: 18px 20px;
        min-width: 380px;
        max-width: 540px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13.5px;
        line-height: 1.45;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 14px 0;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @media (prefers-color-scheme: dark) {
        h1 img {
          filter: invert(0.95);
        }
      }

      .group {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .field-label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--fg);
      }

      .field-hint {
        font-size: 11.5px;
        color: var(--muted);
      }

      select {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 9px;
        font-family: inherit;
        font-size: 13px;
      }

      .checkbox-row {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        min-block-size: 36px;
        cursor: pointer;
        user-select: none;
      }

      .checkbox-row input[type="checkbox"] {
        accent-color: var(--accent);
        inline-size: 1.2em;
        aspect-ratio: 1;
        margin: 0;
        cursor: pointer;
        flex: none;
      }

      .checkbox-row input[type="checkbox"]:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .saved-status {
        min-block-size: 18px;
        font-size: 12px;
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>
      <img src="icons/zemberek-icon.svg" width="18" height="18" alt="" />
      <span>Zemberek Eklenti Ayarları</span>
    </h1>

    <div class="group">
      <div class="field">
        <label class="field-label" for="opt-profile">Motor Modu</label>
        <select id="opt-profile">
          <option value="studio">Studio (Bağlamsal Tam Düzeltme)</option>
          <option value="lite">Core Lite (Hızlı Yazım Denetimi)</option>
        </select>
        <span class="field-hint">Studio modu ek ayırma/birleştirme ve cümle içi bağlam modelini kullanır.</span>
      </div>

      <div class="field">
        <label class="field-label" for="opt-circumflex">Şapkalı Harf (â / î / û)</label>
        <select id="opt-circumflex">
          <option value="disambiguation">Yalnız Anlam Ayırıcı (hala → hâlâ, kar → kâr)</option>
          <option value="none">Ekleme</option>
          <option value="full">Tam TDK</option>
        </select>
        <span class="field-hint">Deasciify işlemi sırasında düzeltme işareti tercihini belirler.</span>
      </div>
    </div>

    <div class="group">
      <label class="checkbox-row" for="opt-ignore-non-tr">
        <input id="opt-ignore-non-tr" type="checkbox" checked />
        <span>Türkçe olmayan (İngilizce vb.) metinlerde öneri gösterme</span>
      </label>

      <label class="checkbox-row" for="opt-suppress-native">
        <input id="opt-suppress-native" type="checkbox" checked />
        <span>Zemberek aktifken tarayıcının çakışan yazım çizgilerini gizle</span>
      </label>
    </div>

    <div id="opt-status" class="saved-status" role="status"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
