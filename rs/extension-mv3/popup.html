<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Zemberek Türkçe Yazım Asistanı</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-light: #ffffff;
        --bg-dark: #18181b;
        --surface-light: #f4f4f5;
        --surface-dark: #27272a;
        --fg-light: #18181b;
        --fg-dark: #f4f4f5;
        --muted-light: #52525b;
        --muted-dark: #a1a1aa;
        --border-light: #e4e4e7;
        --border-dark: #3f3f46;
        --accent-light: #0d9488;
        --accent-dark: #2dd4bf;
        --bg: var(--bg-light);
        --surface: var(--surface-light);
        --fg: var(--fg-light);
        --muted: var(--muted-light);
        --border: var(--border-light);
        --accent: var(--accent-light);
        accent-color: var(--accent);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--bg-dark);
          --surface: var(--surface-dark);
          --fg: var(--fg-dark);
          --muted: var(--muted-dark);
          --border: var(--border-dark);
          --accent: var(--accent-dark);
        }
      }

      @supports (color: light-dark(white, black)) {
        :root {
          --bg: light-dark(var(--bg-light), var(--bg-dark));
          --surface: light-dark(var(--surface-light), var(--surface-dark));
          --fg: light-dark(var(--fg-light), var(--fg-dark));
          --muted: light-dark(var(--muted-light), var(--muted-dark));
          --border: light-dark(var(--border-light), var(--border-dark));
          --accent: light-dark(var(--accent-light), var(--accent-dark));
        }
      }

      body {
        margin: 0;
        inline-size: 356px;
        padding: 12px 14px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        box-sizing: border-box;
        overflow-x: hidden;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 9px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
      }

      .section-label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }

      input[type="text"],
      textarea {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.45;
        box-sizing: border-box;
      }

      input[type="text"]:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      textarea {
        width: 100%;
        min-height: 136px;
        resize: vertical;
        margin-bottom: 8px;
      }

      .btn-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        border-radius: 7px;
        padding: 6px 11px;
        min-block-size: 32px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      button.primary {
        background: #0d9488;
        border-color: #0d9488;
        color: #ffffff;
        flex: 1;
      }

      button:hover {
        opacity: 0.92;
      }

      .icon-btn {
        padding: 0;
        min-inline-size: 32px;
        min-block-size: 32px;
        color: var(--fg);
      }

      .icon-btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }

      .icon-btn.ghost:hover {
        background: var(--surface);
        border-color: var(--border);
        color: var(--fg);
      }

      .icon-svg {
        pointer-events: none;
        flex: none;
      }

      .copy-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .copy-btn .icon-check {
        display: none;
      }

      .copy-btn[data-copied] {
        border-color: var(--accent);
        color: var(--accent);
      }

      .copy-btn[data-copied] .icon-copy {
        display: none;
      }

      .copy-btn[data-copied] .icon-check {
        display: block;
      }

      .copy-tip {
        position: absolute;
        inset-block-end: calc(100% + 5px);
        inset-inline-end: 0;
        background: var(--fg);
        color: var(--bg);
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 5px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms ease;
      }

      .copy-btn[data-copied] + .copy-tip,
      .copy-btn[data-failed] + .copy-tip {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .copy-tip {
          transition: none;
        }
      }

      .dict-section {
        border-top: 1px solid var(--border);
        padding-top: 9px;
      }

      .dict-input-row {
        display: flex;
        gap: 6px;
      }

      .dict-input-row input {
        flex: 1;
        padding: 5px 8px;
        font-size: 12.5px;
      }

      .dict-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
        max-height: 68px;
        overflow-y: auto;
      }

      .dict-chips:empty {
        display: none;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11.5px;
      }

      .chip button {
        border: 0;
        background: transparent;
        padding: 0 2px;
        min-block-size: 18px;
        color: var(--muted);
        font-size: 12px;
      }

      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        padding-top: 7px;
        border-top: 1px solid var(--border);
      }

      .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-block-size: 32px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--fg);
        cursor: pointer;
        user-select: none;
      }

      .checkbox-label input[type="checkbox"] {
        accent-color: var(--accent);
        inline-size: 15px;
        aspect-ratio: 1;
        margin: 0;
        cursor: pointer;
        flex: none;
      }

      .checkbox-label input[type="checkbox"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <div class="brand">
        <img src="icons/zemberek-icon.svg" width="18" height="18" alt="" />
        <span>Zemberek Türkçe Asistan</span>
      </div>
      <button id="btn-open-settings" type="button" class="icon-btn ghost" aria-label="Eklenti ayarlarını aç" title="Ayarlar">
        <svg class="icon-svg" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <textarea
      id="scratch-input"
      placeholder="Metni buraya yazın veya yapıştırın…"
    ></textarea>

    <div class="btn-row">
      <button id="btn-normalize" type="button" class="primary">Düzelt</button>
      <button id="btn-deasciify" type="button">Deasciify</button>
      <span class="copy-wrap">
        <button id="btn-copy" type="button" class="icon-btn copy-btn" aria-label="Metni panoya kopyala" title="Kopyala">
          <svg class="icon-svg icon-copy" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-svg icon-check" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <span class="copy-tip" role="status"></span>
      </span>
      <button id="btn-clear" type="button" class="icon-btn" aria-label="Metni temizle" title="Temizle">
        <svg class="icon-svg" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        </svg>
      </button>
    </div>

    <div class="dict-section">
      <label class="section-label" for="dict-word-input">Özel Sözlük</label>
      <div class="dict-input-row">
        <input id="dict-word-input" type="text" placeholder="Örn: Gökbörü, kankitap…" />
        <button id="btn-add-word" type="button">Ekle</button>
      </div>
      <div id="dict-chips" class="dict-chips"></div>
    </div>

    <div class="footer-row">
      <label class="checkbox-label" for="toggle-enabled">
        <input id="toggle-enabled" type="checkbox" checked />
        <span>Sayfa içi denetim aktif</span>
      </label>
      <button id="btn-open-sidepanel" type="button" class="icon-btn" aria-label="Yan panelde aç" title="Yan Panelde Aç">
        <svg class="icon-svg" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
