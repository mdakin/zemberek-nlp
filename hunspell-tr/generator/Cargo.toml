[package]
name = "zemberek-hunspell-gen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rayon = "1.10"
rustc-hash = "2.1"
zemberek-core = { path = "../../rs/crates/zemberek-core" }
zemberek-pack = { path = "../../rs/crates/zemberek-pack" }
zemberek-tok = { path = "../../rs/crates/zemberek-tok" }
zemberek-morph = { path = "../../rs/crates/zemberek-morph" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
